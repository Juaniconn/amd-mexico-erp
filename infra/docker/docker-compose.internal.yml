services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: amd-erp-api
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://erp:ykf3i1drkq7fbjz3wvifi3n3@db:5432/erp_db
      REDIS_URL: redis://:redis_pass_2026@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: vcsmvbw56l8rzlz6uzme
      JWT_SECRET: 03hleui0fjny66p58tvm0u3od1nbqkn5kgchp1z22yzfjsg4u3palwu3yk7eb69d
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_SECRET: retpqhx7xhggkc95q636o1001cp4j4y4qwq7v98orbcgrh50xyi8f9n84iokmjlb
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - amd-erp-net

  db:
    image: postgres:16-alpine
    container_name: amd-erp-db
    restart: always
    environment:
      - POSTGRES_USER=erp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-erp_password}
      - POSTGRES_DB=erp_db
      - POSTGRES_INITDB_ARGS=--auth=md5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amd-erp-net

  redis:
    image: redis:7-alpine
    container_name: amd-erp-redis
    restart: always
    command: ["redis-server", "--requirepass", "redis_pass_2026", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amd-erp-net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: amd-erp-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - amd-erp-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  amd-erp-net:
    driver: bridge
