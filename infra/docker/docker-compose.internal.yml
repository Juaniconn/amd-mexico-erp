services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: amd-erp-api
    restart: always
    network_mode: host
    env_file:
      - ../../.env.docker
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD:-erp_password}@127.0.0.1:5432/erp_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2026}@127.0.0.1:6379
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: 9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      - db
      - redis
      - minio

  db:
    image: postgres:16-alpine
    container_name: amd-erp-db
    restart: always
    network_mode: host
    env_file:
      - ../../.env
    environment:
      - POSTGRES_USER=erp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-erp_password}
      - POSTGRES_DB=erp_db
      - POSTGRES_INITDB_ARGS=--auth=md5
      - POSTGRES_HOST_AUTH_METHOD=md5
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=5432"]
    volumes:
      - docker_docker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amd-erp-redis
    restart: always
    network_mode: host
    env_file:
      - ../../.env.docker
    command: ["redis-server", "--bind", "127.0.0.1", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - docker_docker_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: amd-erp-minio
    restart: always
    network_mode: host
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --address "127.0.0.1:9000" --console-address "127.0.0.1:9001"
    volumes:
      - docker_docker_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  docker_docker_postgres_data:
    external: true
  docker_docker_redis_data:
    external: true
  docker_docker_minio_data:
    external: true

networks:
  amd-erp-net:
    driver: bridge
