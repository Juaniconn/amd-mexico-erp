version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: amd-erp-db
    restart: always
    environment:
      - POSTGRES_USER=erp
      - POSTGRES_PASSWORD=ykf3i1drkq7fbjz3wvifi3n3
      - POSTGRES_DB=erp_db
      - POSTGRES_INITDB_ARGS=--auth=md5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amd-erp-net

  redis:
    image: redis:7-alpine
    container_name: amd-erp-redis
    restart: always
    command: ["redis-server", "--requirepass", "redis_pass_2026", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amd-erp-net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: amd-erp-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=vcsmvbw56l8rzlz6uzme
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - amd-erp-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  amd-erp-net:
    driver: bridge
