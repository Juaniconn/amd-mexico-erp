name: Deploy AMD ERP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH OK'; pwd; whoami" || { echo 'SSH FAILED'; exit 1; }

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /data/projets/amd_web_app
            git pull origin main
            
            # Configurar pnpm y aprobar builds
            pnpm config set approve-builds true
            
            # Instalar dependencias
            pnpm install --no-frozen-lockfile
            
            # Reiniciar servicios (sin docker build por ahora)
            docker compose -f infra/docker/docker-compose.yml up -d --force-recreate
            
            # Limpiar imágenes antiguas
            docker image prune -f
            
            echo "Deploy OK"
          EOF
