name: Deploy AMD ERP

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-amd-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server (hot-deploy)
        run: |
          ssh -o StrictHostKeyChecking=no -o ForwardAgent=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -lc "bash -s"' << 'ENDSSH'
          set -eux
          LOG=/tmp/amd-erp-deploy.log
          exec > >(tee -a "$LOG") 2>&1
          echo "===== $(date -Is) deploy start ====="
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          unset SSH_AUTH_SOCK || true
          unset SSH_AGENT_PID || true
          echo "USER=$(whoami) HOME=$HOME PWD=$(pwd)"
          echo "which git=$(which git) pnpm=$(which pnpm || echo MISSING) docker=$(which docker || echo MISSING)"

          cd /home/ubuntu/data/projets/amd_web_app
          git status -sb
          if [ -n "$(git status --porcelain)" ]; then
            echo "ABORT dirty tree"
            git status --porcelain | head -40
            exit 1
          fi

          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse --short HEAD)"

          pnpm install --frozen-lockfile
          pnpm --filter api exec prisma generate
          pnpm --filter api build
          NEXT_PUBLIC_API_URL=/api pnpm --filter web build

          docker cp apps/api/dist/. amd-erp-api:/app/apps/api/dist/
          if [ -f apps/api/.env ]; then
            docker cp apps/api/.env amd-erp-api:/app/.env
          fi
          docker cp apps/web/.next/. amd-erp-web:/app/.next/
          docker restart amd-erp-api amd-erp-web

          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma || echo "WARN migrate"

          sleep 5
          curl -sf -o /dev/null http://127.0.0.1:3001/api/docs && echo API_OK
          curl -sf -o /dev/null http://127.0.0.1:3000/ && echo WEB_OK
          echo "===== deploy OK ====="
          ENDSSH

      - name: Fetch remote deploy log
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -o ForwardAgent=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "tail -n 80 /tmp/amd-erp-deploy.log || echo NO_LOG"
