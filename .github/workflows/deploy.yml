name: Deploy AMD ERP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH OK'; pwd; whoami" || { echo 'SSH FAILED'; exit 1; }

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            export PATH="$HOME/.local/bin/bin:$PATH"
            cd /home/ubuntu/data/projets/amd_web_app
            
            # Instalar pnpm 9.15.4 si no está o si es v12+
            if ! command -v pnpm &> /dev/null || pnpm --version | grep -q "^12"; then
              curl -fsSL https://get.pnpm.io/install.sh | env PNPM_HOME="$HOME/.local/bin" sh -
              export PATH="$HOME/.local/bin:$PATH"
            fi
            
            git pull origin main
            
            # Instalar dependencias con pnpm 9
            pnpm@9 install --no-frozen-lockfile
            
            # Levantar base de datos (PostgreSQL + Redis + MinIO)
            sg docker -c "docker compose -f infra/docker/docker-compose.yml up -d db redis minio"
            
            # Esperar a que la base de datos esté lista
            sleep 10
            
            # Generar cliente Prisma y ejecutar migraciones
            npx prisma generate
            npx prisma migrate deploy
            
            # Seed de datos iniciales
            npx prisma db seed
            
            # Verificar contenedores corriendo
            sg docker -c "docker compose -f infra/docker/docker-compose.yml ps"
            
            echo "Deploy OK"
          EOF
