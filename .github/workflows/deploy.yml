name: Deploy AMD ERP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH OK'; pwd; whoami" || { echo 'SSH FAILED'; exit 1; }

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            cd /home/ubuntu/data/projets/amd_web_app
            
            # Instalar pnpm y dependencias
            corepack enable
            pnpm config set approve-builds true
            pnpm install --no-frozen-lockfile
            
            # Descargar imágenes (si no están locales), luego levantar
            sg docker -c "docker compose -f infra/docker/docker-compose.yml pull --ignore-pull-failures" 2>&1 || true
            sg docker -c "docker compose -f infra/docker/docker-compose.yml up -d db redis minio"
            
            # Esperar a que PostgreSQL esté listo
            echo "Esperando a que PostgreSQL esté listo..."
            for i in $(seq 1 30); do
              if sg docker -c "docker compose -f infra/docker/docker-compose.yml exec db pg_isready -h localhost -p 5432 -U erp -d erp_db" > /dev/null 2>&1; then
                echo "PostgreSQL listo"
                break
              fi
              sleep 2
            done
            
            # Generar cliente Prisma y ejecutar migraciones
            pnpm --filter @amd/api prisma:generate
            pnpm --filter @amd/api prisma:migrate
            
            # Seed de datos iniciales
            pnpm --filter @amd/api prisma:seed
            
            # Verificar contenedores corriendo
            sg docker -c "docker compose -f infra/docker/docker-compose.yml ps"
            
            echo "Deploy OK"
          EOF
