name: Deploy AMD ERP

# Solo despliega cuando CI en main terminó OK.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-amd-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o ForwardAgent=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo SSH_OK; hostname; whoami; cd /home/ubuntu/data/projets/amd_web_app && git rev-parse --short HEAD"

      - name: Deploy to server (hot-deploy)
        run: |
          ssh -o StrictHostKeyChecking=no -o ForwardAgent=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'ENDSSH'
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # Evitar que el agent de GitHub Actions se use para git fetch → GitHub
          unset SSH_AUTH_SOCK
          unset SSH_AGENT_PID

          cd /home/ubuntu/data/projets/amd_web_app

          echo "== git =="
          git status -sb
          if [ -n "$(git status --porcelain)" ]; then
            echo "ABORT: working tree sucio"
            git status --porcelain | head -40
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse --short HEAD)"

          echo "== install & build =="
          pnpm install --frozen-lockfile
          pnpm --filter api exec prisma generate
          pnpm --filter api build
          NEXT_PUBLIC_API_URL=/api pnpm --filter web build

          echo "== hot-deploy into running containers =="
          docker cp apps/api/dist/. amd-erp-api:/app/apps/api/dist/
          if [ -f apps/api/.env ]; then
            docker cp apps/api/.env amd-erp-api:/app/.env
          fi
          docker cp apps/web/.next/. amd-erp-web:/app/.next/
          docker restart amd-erp-api amd-erp-web

          echo "== migrate =="
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma || \
            echo "WARN: migrate skip/fail"

          echo "== smoke =="
          sleep 5
          curl -sf -o /dev/null http://127.0.0.1:3001/api/docs && echo API_OK
          curl -sf -o /dev/null http://127.0.0.1:3000/ && echo WEB_OK
          docker ps --filter name=amd-erp --format 'table {{.Names}}\t{{.Status}}'
          echo "Deploy OK"
          ENDSSH
