name: Deploy AMD ERP

# Solo despliega cuando CI en main terminó OK (no en paralelo ni si lint falla).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-amd-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo SSH_OK; hostname; whoami; cd /home/ubuntu/data/projets/amd_web_app && git rev-parse --short HEAD && git status -sb"

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'ENDSSH'
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          cd /home/ubuntu/data/projets/amd_web_app

          echo "== git status =="
          git status -sb
          if [ -n "$(git status --porcelain)" ]; then
            echo "ABORT: working tree sucio en el servidor"
            git status --porcelain | head -40
            exit 1
          fi

          echo "== pull origin/main =="
          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse --short HEAD)"

          echo "== rebuild api + web =="
          # Imágenes con los mismos nombres que ya corren en el host
          docker build -t amd-erp-api:latest -f apps/api/Dockerfile .
          docker build -t amd-erp-web:latest -f apps/web/Dockerfile .

          echo "== recreate api/web containers =="
          # Preservar db/redis/minio; solo recrear app
          docker stop amd-erp-api amd-erp-web 2>/dev/null || true
          docker rm amd-erp-api amd-erp-web 2>/dev/null || true

          # Arrancar vía compose (network_mode host en api)
          cd infra/docker
          sg docker -c "docker compose -p amd-erp up -d --no-deps --force-recreate api web" \
            || sg docker -c "docker compose up -d --no-deps --force-recreate api web"

          echo "== wait api =="
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3001/api/docs; then
              echo "API OK"
              break
            fi
            sleep 3
          done

          echo "== prisma migrate (host) =="
          cd /home/ubuntu/data/projets/amd_web_app
          npx prisma generate --schema apps/api/prisma/schema.prisma || true
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma || \
            echo "WARN: migrate falló o no hay migraciones pendientes"

          docker ps --filter name=amd-erp --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "Deploy OK"
          ENDSSH
